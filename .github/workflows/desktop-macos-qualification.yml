name: Build universal Mac deletion candidate
on:
  push:
    branches: [qualification/5-desktop]
    paths: [.github/workflows/desktop-macos-qualification.yml]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cabec50ab0674a65988a768439f352d0b29702c7
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenCoven/coven
          ref: 29bb4f964f257d3f1cf8a3e2e32ab5657f65dd3b
          path: consumer
          persist-credentials: false
      - name: Compile the exact candidate for both Mac architectures
        working-directory: consumer
        run: |
          test "$(git write-tree)" = 5844d2c3a22e2622aa59ec05ca011aad938e6306
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          export MACOSX_DEPLOYMENT_TARGET=11.0 COVEN_BUILD_VERSION=v0.1.2 COVEN_BUILD_COMMIT=29bb4f964f257d3f1cf8a3e2e32ab5657f65dd3b
          cargo build --release --locked -p coven-cli --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Stage and qualify the two native payloads
        run: |
          mkdir payloads
          cp consumer/target/aarch64-apple-darwin/release/coven payloads/coven-arm64
          cp consumer/target/x86_64-apple-darwin/release/coven payloads/coven-x86_64
          shasum -a 256 payloads/coven-* | tee payloads/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-mac-payloads
          path: payloads/
          retention-days: 14
      - name: Exercise installed offline operations
        run: python3 tests/installed_deletion.py "$PWD/payloads/coven-arm64"
      - name: Build the universal Mac candidate
        run: |
          installer/macos/build.sh payloads/coven-arm64 "$(awk '/coven-arm64$/ {print $1}' payloads/SHA256SUMS)" consumer/LICENSE assets payloads/coven-x86_64 "$(awk '/coven-x86_64$/ {print $1}' payloads/SHA256SUMS)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-universal-candidate
          path: |
            payloads/
            assets/*.zip
          retention-days: 14
      - name: Exercise the installer-owned disk folder and both offline journeys
        run: |
          ditto -x -k assets/Coven-Host-0.1.2-macOS.zip "$RUNNER_TEMP/reopened"
          xcrun swiftc installer/macos/Installer.swift installer/macos/Verify.swift -o "$RUNNER_TEMP/verify"
          python3 installer/macos/verify.py "$RUNNER_TEMP/reopened/Coven Host.app" "$RUNNER_TEMP/verify" --deletions
