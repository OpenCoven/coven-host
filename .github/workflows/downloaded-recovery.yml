name: Verify two offline Castle folders from the downloaded kit
on:
  push:
    branches: [qualification/5-desktop]
    paths: [.github/workflows/downloaded-recovery.yml]
permissions:
  contents: read
  actions: read
jobs:
  installed-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the published offline installer kit
        shell: bash
        run: |
          mkdir assets
          curl --fail --location --silent --show-error --retry 3 --output assets/Coven-Host-0.1.2-Offline.zip https://github.com/OpenCoven/coven-host/releases/download/v0.1.2/Coven-Host-0.1.2-Offline.zip
      - name: Install Debian package from the offline kit and exercise recovery
        run: |
          echo "b84a78c1475dfd8e8969fa441c5d71e4435a4ce8c8b11065cb98bb542919e4bf  assets/Coven-Host-0.1.2-Offline.zip" | sha256sum -c -
          unzip -q assets/Coven-Host-0.1.2-Offline.zip -d opened
          manifest=$(find opened -name SHA256SUMS)
          (cd "$(dirname "$manifest")" && sha256sum -c SHA256SUMS)
          sudo dpkg -i "$(find opened -name '*-${{ matrix.arch }}.deb')"
          sudo useradd -m -s /bin/bash coven-test
          test "$(findmnt -T /home/coven-test -no FSTYPE)" = ext4
          sudo install -m 755 installer/linux/check-installed.py tests/installed_deletion.py /tmp/
          if ! sudo -i -u coven-test python3 /tmp/check-installed.py --disposable-account coven-test --launcher /usr/bin/coven-host-desktop --app /usr/lib/coven-host-desktop; then
            sudo -i -u coven-test cat /home/coven-test/.local/state/coven-host-support/last-error.txt || true
            exit 1
          fi
          sudo -i -u coven-test python3 /tmp/installed_deletion.py /usr/lib/coven-host-desktop/coven
  installed-windows:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the published offline installer kit
        shell: bash
        run: |
          mkdir assets
          curl --fail --location --silent --show-error --retry 3 --output assets/Coven-Host-0.1.2-Offline.zip https://github.com/OpenCoven/coven-host/releases/download/v0.1.2/Coven-Host-0.1.2-Offline.zip
      - name: Verify the kit and extract the Windows installer
        shell: bash
        run: |
          echo "b84a78c1475dfd8e8969fa441c5d71e4435a4ce8c8b11065cb98bb542919e4bf  assets/Coven-Host-0.1.2-Offline.zip" | sha256sum -c -
          unzip -q assets/Coven-Host-0.1.2-Offline.zip -d opened
          manifest=$(find opened -name SHA256SUMS)
          (cd "$(dirname "$manifest")" && sha256sum -c SHA256SUMS)
      - name: Download the published Windows upgrade baseline
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 3 --output previous.exe https://github.com/OpenCoven/coven-host/releases/download/v0.1.1/Coven-Host-0.1.1-Windows-x64.exe
          echo "fa5b2d763805ed73bd82130654e3456596ac26388bd762400916cad92cd655a2  previous.exe" | sha256sum -c -
      - name: Exercise the GUI installation and NTFS file sharing
        shell: powershell
        run: |
          $installer = @(Get-ChildItem opened -Recurse -Filter '*.exe')
          if ($installer.Count -ne 1 -or (Get-Volume -DriveLetter $env:SystemDrive[0]).FileSystem -ne 'NTFS' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Expected one x64 installer and NTFS' }
          ./tests/windows/run-as-standard-user.ps1 -Installer $installer[0].FullName -PreviousInstaller (Resolve-Path previous.exe).Path
