name: Installed Windows desktop deletion qualification
on:
  push:
    branches: [qualification/5-desktop]
    paths: [.github/workflows/desktop-windows-qualification.yml, tests/windows/**, tests/installed_deletion.py, installer/windows/**]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 08c24f9bcb0492199ddef50485d3a679df6818b6
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenCoven/coven
          ref: 8fb558c60b006b337bf7850e6e43e0793b788097
          path: consumer
          persist-credentials: false
      - name: Verify immutable consumer source and resolved Host pin
        working-directory: consumer
        shell: bash
        run: |
          set -eu
          sed -i 's/247904def96591b7f473a6e9a98ec8363b925da0/c39e4474be545ae64fdb6bc88bcfa7e3443286be/g' crates/coven-cli/Cargo.toml Cargo.lock
          git add crates/coven-cli/Cargo.toml Cargo.lock
          test "$(git write-tree)" = 5844d2c3a22e2622aa59ec05ca011aad938e6306
          grep -F c39e4474be545ae64fdb6bc88bcfa7e3443286be crates/coven-cli/Cargo.toml Cargo.lock
      - name: Build and pack the native CLI and npm wrapper
        working-directory: consumer
        shell: bash
        run: |
          set -eu
          export COVEN_BUILD_VERSION=v0.1.2-review.2 COVEN_NPM_VERSION=0.1.2-review.2
          cargo build --release --locked -p coven-cli --target x86_64-pc-windows-msvc
          node scripts/publish-npm.mjs --target=windows --skip-build --dry-run
          mkdir packages-for-test
          npm pack ./npm/dist/windows --pack-destination packages-for-test
          npm pack ./npm/dist/coven --pack-destination packages-for-test
          cd packages-for-test
          npm install --offline --no-audit --no-fund --ignore-scripts ./*.tgz
          sha256sum ./*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-windows-npm-input
          path: consumer/packages-for-test/*.tgz
          retention-days: 14
      - name: Verify the installed npm package and seal the checked binary into the installer
        shell: pwsh
        run: |
          $binary = & consumer/packages-for-test/node_modules/.bin/coven.cmd --print-native-binary-path
          if ($LASTEXITCODE -ne 0) { throw 'Installed wrapper failed' }
          $packages = @(Get-ChildItem consumer/packages-for-test -Filter '*cli-windows-*.tgz')
          if ($packages.Count -ne 1) { throw 'Expected one native x64 package' }
          ./installer/windows/build.ps1 -Package $packages[0].FullName -OutputDirectory assets -CovenLicense consumer/LICENSE -PackageSha256 (Get-FileHash $packages[0].FullName).Hash -CliSha256 (Get-FileHash $binary).Hash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-x64-installer
          path: assets/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Install as a standard user on native Windows x64 and NTFS
        shell: powershell
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $volume = Get-Volume -DriveLetter ($env:SystemDrive[0])
          if ("$arch" -ne 'X64' -or $volume.FileSystem -ne 'NTFS') { throw 'Windows x64 and NTFS required' }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, BuildNumber, OSArchitecture
          Write-Output "Hosted VM, native $arch, $($volume.FileSystem)"
          ./tests/windows/run-as-standard-user.ps1 (Resolve-Path assets/*.exe)
      - name: Download and verify the previous Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v0.1.1 --repo OpenCoven/coven-host --pattern 'Coven-Host-0.1.1-Windows-x64.exe' -D previous
          $previous = (Resolve-Path previous/*.exe).Path
          if ((Get-FileHash $previous).Hash -ne 'FA5B2D763805ED73BD82130654E3456596AC26388BD762400916CAD92CD655A2') { throw 'Previous release digest mismatch' }
      - name: Upgrade the previous Windows installation in its own standard account
        shell: powershell
        run: |
          ./tests/windows/run-as-standard-user.ps1 -Installer (Resolve-Path assets/*.exe).Path -PreviousInstaller (Resolve-Path previous/*.exe).Path
      - name: Verify actionable diagnostics for a group-owned elevated profile
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path tests).Path
          python tests/windows/qualify-installer.py --group-owned (Resolve-Path assets/*.exe).Path
