name: Installed Windows desktop deletion qualification
on:
  push:
    branches: [qualification/5-desktop]
    paths: [.github/workflows/desktop-windows-qualification.yml, tests/windows/**, tests/installed_deletion.py, installer/windows/**]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          run-id: 45000933880
          artifact-ids: 14745379239
          github-token: ${{ github.token }}
          path: assets
      - name: Verify the exact desktop executable downloaded from the original qualification
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem assets -Recurse -Filter '*.exe')
          if ($installer.Count -ne 1 -or (Get-FileHash $installer[0].FullName).Hash -ne '601285F7F5486C50C0001EA7D6B47B6D753688EAB93B96AC113870917BB9EB70') { throw 'Installer SHA-256 mismatch' }
      - name: Install as a standard user on native Windows x64 and NTFS
        shell: powershell
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          $volume = Get-Volume -DriveLetter ($env:SystemDrive[0])
          if ("$arch" -ne 'X64' -or $volume.FileSystem -ne 'NTFS') { throw 'Windows x64 and NTFS required' }
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, BuildNumber, OSArchitecture
          Write-Output "Hosted VM, native $arch, $($volume.FileSystem)"
          ./tests/windows/run-as-standard-user.ps1 (Get-ChildItem assets -Recurse -Filter *.exe).FullName
