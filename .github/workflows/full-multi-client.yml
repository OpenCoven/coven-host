name: Verify contributor readiness with the full Linux command
on:
  push:
    branches: [qualification/6-published-clients]
    paths: [.github/workflows/full-multi-client.yml]
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 502dabb0b5c4a83f3fb8e0f16c0deb0386c5d1ca
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Install Gitleaks (same version as the pre-commit guard)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: gitleaks version
      - name: Run the full suite with a working alternate Python executable
        run: |
          mkdir "$RUNNER_TEMP/interpreters"
          ln -s "$(command -v python3)" "$RUNNER_TEMP/interpreters/python"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/interpreters/python3"
          chmod +x "$RUNNER_TEMP/interpreters/python3"
          PATH="$RUNNER_TEMP/interpreters:$PATH" scripts/check.sh --full
