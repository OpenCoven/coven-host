name: Installed Linux desktop deletion qualification
on:
  push:
    branches: [qualification/5-desktop]
    paths: [.github/workflows/desktop-linux-qualification.yml]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 22f802e76e0c944707bb0dd3b14716916c091f95
          fetch-depth: 0
          persist-credentials: false
      - run: |
          findmnt -T "$RUNNER_TEMP" -o SOURCE,FSTYPE,TARGET
          test "$(findmnt -T "$RUNNER_TEMP" -no FSTYPE)" = ext4
          export TMPDIR="$RUNNER_TEMP"
          cargo test --locked --all-targets
          tests/compat-linux.sh --deletions
          tests/compat-linux.sh
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenCoven/coven
          ref: 6855b5a4b0b26f08bd711d302ffc8534b27ebea2
          path: consumer
          persist-credentials: false
      - name: Verify candidate source and build the native CLI
        working-directory: consumer
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          sed -i 's/65927dd5e64d732cb99926bed66492994acdcec5/22f802e76e0c944707bb0dd3b14716916c091f95/g' crates/coven-cli/Cargo.toml Cargo.lock
          git add crates/coven-cli/Cargo.toml Cargo.lock
          test "$(git write-tree)" = d30e4742a9e3fbca2c03f96a4697dfe895687e60
          COVEN_BUILD_VERSION=v0.1.2-qualification.24 cargo build --locked --release -p coven-cli
      - name: Qualify executable and install Debian package
        run: |
          native="$PWD/consumer/target/release/coven"
          sha256sum "$native"
          python3 tests/installed_deletion.py "$native"
          python3 installer/linux/build.py --arch "${{ matrix.arch }}" --native "$native" --sha256 "$(sha256sum "$native" | cut -d' ' -f1)" --coven-license consumer/LICENSE --out assets
          sudo dpkg -i assets/*.deb
          sudo useradd -m -s /bin/bash coven-test
          test "$(findmnt -T /home/coven-test -no FSTYPE)" = ext4
          sudo install -m 755 installer/linux/check-installed.py tests/installed_deletion.py /tmp/
          sudo -i -u coven-test python3 /tmp/check-installed.py --disposable-account coven-test --launcher /usr/bin/coven-host-desktop --app /usr/lib/coven-host-desktop
          sudo -i -u coven-test python3 /tmp/installed_deletion.py /usr/lib/coven-host-desktop/coven
          sha256sum assets/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: assets/
          retention-days: 14
