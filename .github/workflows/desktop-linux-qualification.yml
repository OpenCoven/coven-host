name: Installed Linux desktop deletion qualification
on:
  push:
    branches: [qualification/5-desktop]
    paths: [.github/workflows/desktop-linux-qualification.yml, installer/linux/**]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            artifact: 14744859464
            sha: e60445e127bf5ad8b4019f5602446adb62042080529089adf7dcb302a6a7db1a
          - runner: ubuntu-24.04-arm
            arch: arm64
            artifact: 14745692202
            sha: 62dfdc582f1835446eca37800f1722eb98322b6380226c91cd92925e10b7a3eb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenCoven/coven
          ref: 6855b5a4b0b26f08bd711d302ffc8534b27ebea2
          path: consumer
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          run-id: 45000242079
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: retained
      - name: Package the native executable from the immutable qualification run
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          deb=$(find retained -name '*.deb' -type f)
          dpkg-deb -x "$deb" extracted
          native="$PWD/extracted/usr/lib/coven-host-desktop/coven"
          python3 installer/linux/build.py --arch "${{ matrix.arch }}" --native "$native" --sha256 "${{ matrix.sha }}" --coven-license consumer/LICENSE --out assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: assets/
          retention-days: 14
      - name: Exercise the installed desktop and report startup diagnostics
        run: |
          sudo dpkg -i assets/*.deb
          sudo useradd -m -s /bin/bash coven-test
          test "$(findmnt -T /home/coven-test -no FSTYPE)" = ext4
          sudo install -m 755 installer/linux/check-installed.py tests/installed_deletion.py /tmp/
          if ! sudo -i -u coven-test python3 /tmp/check-installed.py --disposable-account coven-test --launcher /usr/bin/coven-host-desktop --app /usr/lib/coven-host-desktop; then
            sudo -i -u coven-test cat /home/coven-test/.local/state/coven-host-support/last-error.txt || true
            exit 1
          fi
          sudo -i -u coven-test python3 /tmp/installed_deletion.py /usr/lib/coven-host-desktop/coven
          sha256sum assets/*
